[package]
name = "cloud_profiler_rust"
version = "1.2.3"
edition = "2021"
license = "MIT"
description = "Google Cloud Profiler Rust Agent"
homepage = "https://github.com/statsig-io/cloud-profiler-rust"
repository = "https://github.com/statsig-io/cloud-profiler-rust"
keywords = ["pprof", "profiling", "gcp", "cloud"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
pprof = { version="0.14.0", features = ["protobuf", "protobuf-codec"] }
google-cloudprofiler2 = "5.0.5"
hyper-rustls = { version = "0.23.2", features = ["webpki-roots", "http2"] }
serde = "1.0.197"
serde_json = "1.0.115"
envy = "0.4.2"
tokio = "1.37.0"
flate2 = "1.0.28"
google-cloud-auth = "0.15.0"
google-cloud-token = "0.1.2"
google-cloud-metadata = "0.5.0"
thiserror = "1.0.58"
rand = "0.8.5"

[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = { version = "0.6", features = ["profiling", "unprefixed_malloc_on_supported_platforms"] }
tikv-jemalloc-sys = { version = "0.6", features = ["profiling"] }
jemalloc_pprof = "0.8.1"
